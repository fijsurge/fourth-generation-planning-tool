plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fourthgenplanner.wear'
    compileSdk 34

    defaultConfig {
        applicationId "com.fourthgenplanner.wear"
        minSdk 30  // Wear OS 3+ (Pixel Watch 1+)
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        debug {
            storeFile file("../../android/app/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'androidx.core:core-ktx:1.12.0'

    // Wearable DataLayer — receives data from phone app
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'

    // Wear OS Tiles
    implementation 'androidx.wear.tiles:tiles:1.3.0'
    implementation 'androidx.wear.protolayout:protolayout:1.2.0'
    implementation 'androidx.wear.protolayout:protolayout-material:1.2.0'

    // Guava for ListenableFuture (required by Tiles API)
    implementation 'com.google.guava:guava:32.1.3-android'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Wear Compose — for GoalsActivity scrollable list
    implementation 'androidx.wear.compose:compose-material:1.2.1'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.compose.ui:ui:1.6.0'
    implementation 'androidx.compose.runtime:runtime:1.6.0'
}
